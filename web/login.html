<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول - كاشير برو</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src * data:; connect-src https://*.supabase.co wss://*.supabase.co;">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script><script src="assets/js/supabase.js"></script><script src="assets/js/utils.js"></script></head>
<body><div class="login-page"><div class="login-card">
<div class="logo"><i class="fa-solid fa-cash-register"></i></div>
<h2 class="center" style="margin-bottom:4px">كاشير برو</h2><p class="center muted mb">نظام إدارة نقاط البيع المتكامل</p>
<div class="tabs"><button class="active" data-t="login">دخول</button><button data-t="signup">حساب جديد</button></div>
<form id="loginForm"><div class="form-group"><label>البريد الإلكتروني</label><input class="input" name="email" type="email" required autocomplete="email"></div>
<div class="form-group"><label>كلمة المرور</label><input class="input" name="password" type="password" required minlength="6" autocomplete="current-password"></div>
<button class="btn block lg" id="loginBtn"><i class="fa-solid fa-right-to-bracket"></i> دخول</button>
<p class="center mt small"><a href="#" id="forgot" style="color:var(--primary)">نسيت كلمة المرور؟</a></p></form>
<form id="signupForm" class="hidden"><div class="form-group"><label>الاسم الكامل</label><input class="input" name="full_name" required maxlength="80"></div>
<div class="form-group"><label>البريد الإلكتروني</label><input class="input" name="email" type="email" required></div>
<div class="form-group"><label>كلمة المرور</label><input class="input" name="password" type="password" required minlength="8" placeholder="8 أحرف على الأقل"></div>
<button class="btn success block lg" id="signupBtn"><i class="fa-solid fa-user-plus"></i> إنشاء حساب</button>
<p class="small muted mt center">أول حساب يُسجّل يصبح مدير النظام تلقائياً</p></form>
</div></div>
<script>
db.auth.getSession().then(({data:{session}})=>{ if(session) location.replace('pages/dashboard.html'); });
if(U.param('err')==='disabled') U.toast('تم تعطيل حسابك. تواصل مع المدير','error');
U.qsa('.tabs button').forEach(b=>b.onclick=()=>{U.qsa('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');U.qs('#loginForm').classList.toggle('hidden',b.dataset.t!=='login');U.qs('#signupForm').classList.toggle('hidden',b.dataset.t!=='signup');});
// حماية بسيطة من brute force على مستوى الواجهة
let attempts = +sessionStorage.getItem('la')||0;
U.qs('#loginForm').onsubmit = async e=>{ e.preventDefault(); if(attempts>=5){ return U.toast('محاولات كثيرة، انتظر دقيقة','error'); }
  const d=U.formData(e.target); const btn=U.qs('#loginBtn'); U.loading(btn);
  const {error}=await db.auth.signInWithPassword({email:d.email,password:d.password}); U.loading(btn,false);
  if(error){ attempts++; sessionStorage.setItem('la',attempts); if(attempts>=5) setTimeout(()=>{attempts=0;sessionStorage.setItem('la',0)},60000); return U.toast('بيانات الدخول غير صحيحة','error'); }
  const next=U.param('next'); location.replace(next && next.startsWith('/') && !next.startsWith('//') ? next : 'pages/dashboard.html'); };
U.qs('#signupForm').onsubmit = async e=>{ e.preventDefault(); const d=U.formData(e.target); const btn=U.qs('#signupBtn'); U.loading(btn);
  const {data,error}=await db.auth.signUp({email:d.email,password:d.password,options:{data:{full_name:d.full_name}}}); U.loading(btn,false);
  if(error) return U.toast(error.message,'error');
  if(data.session) location.replace('pages/dashboard.html'); else U.toast('تم إنشاء الحساب. تحقق من بريدك لتفعيله','info'); };
U.qs('#forgot').onclick = async e=>{ e.preventDefault(); const email=U.qs('#loginForm [name=email]').value; if(!email) return U.toast('أدخل بريدك أولاً','info');
  await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname.replace('login.html','pages/profile.html')}); U.toast('تم إرسال رابط الاستعادة','success'); };
</script></body></html>
