<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="icon" type="image/svg+xml" href="assets/favicon.svg"><meta name="theme-color" content="#4f46e5"><meta name="viewport" content="width=device-width,initial-scale=1"><title>كاشير برو</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src * data: blob:; connect-src https://*.supabase.co wss://*.supabase.co;">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script><script src="assets/js/supabase.js"></script>
<script src="assets/js/boot.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap');
  *{margin:0;box-sizing:border-box}
  body{font-family:'Cairo',Tahoma,sans-serif;height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0f172a,#312e81 60%,#4f46e5);color:#fff;overflow:hidden}
  .boot{display:flex;flex-direction:column;align-items:center;gap:18px;animation:fade .5s ease}
  .boot .logo{width:84px;height:84px;border-radius:24px;background:linear-gradient(135deg,#4f46e5,#7c3aed);display:grid;place-items:center;font-size:38px;box-shadow:0 20px 50px rgba(79,70,229,.5);position:relative}
  .boot .logo:after{content:'';position:absolute;inset:-10px;border-radius:30px;border:2px solid rgba(255,255,255,.35);animation:ring 1.6s ease-out infinite}
  .boot h1{font-size:22px;font-weight:800;letter-spacing:.3px}
  .boot .bar{width:180px;height:5px;border-radius:5px;background:rgba(255,255,255,.18);overflow:hidden}
  .boot .bar i{display:block;height:100%;width:40%;border-radius:5px;background:#fff;animation:slide 1.1s ease-in-out infinite}
  .boot small{opacity:.65;font-size:12px;font-weight:600}
  @keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1}}
  @keyframes ring{0%{transform:scale(.85);opacity:1}100%{transform:scale(1.25);opacity:0}}
  @keyframes slide{0%{transform:translateX(120%)}100%{transform:translateX(-220%)}}
</style>
</head><body>
<div class="boot">
  <div class="logo"><i class="fa-solid fa-cash-register"></i></div>
  <h1>كاشير برو</h1>
  <div class="bar"><i></i></div>
  <small>جاري تحميل نظام نقاط البيع…</small>
</div>
</body></html>
